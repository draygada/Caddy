[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "strafe-order-execution"
version = "0.1.0"
description = "Provider-neutral, fail-closed order dispatch boundary for sealed sourcing packages"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_execution"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["../../tests/order-execution"]
