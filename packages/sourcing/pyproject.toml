[project]
name = "forge-sourcing"
version = "0.1.0"
description = "Strafe Forge sourcing lane: a round state machine over pure functions and dated fixtures. Runtime is stdlib-only."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_sourcing"]
