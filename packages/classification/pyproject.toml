[project]
name = "forge-classification"
version = "0.1.0"
description = "Strafe Forge classification lane: a pure order-of-review engine over a dated reference pack. Runtime is stdlib-only."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
live = []  # the live model adapter imports `anthropic` lazily; pinning it is an integrator decision (license + transitive notice review owed)

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "jsonschema==4.25.1",
]


[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_classification"]
