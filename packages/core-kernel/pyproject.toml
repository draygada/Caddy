[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "strafe-forge-core-kernel"
version = "0.1.0"
description = "Server-authoritative parametric CAD kernel for Strafe Forge"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cadquery-ocp-novtk==7.9.3.1",
  "jsonschema==4.25.1",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strafe_forge_core"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["../../tests/core-kernel"]
