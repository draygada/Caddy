[project]
name = "caddydaddy-cad-service"
version = "0.1.0"
description = "Stateless OpenCascade-backed CAD authoring and interchange service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery-ocp-novtk==7.9.3.1",
  "fastapi==0.116.1",
  "pydantic==2.11.7",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "uvicorn==0.35.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
